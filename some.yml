openapi: 3.0.3
info:
  title: Chatbot BFF API
  version: 1.0.0
  description: |
    Backend-for-Frontend (BFF) REST API for a React Chatbot UI, fronted by Amazon API Gateway (REST) and backed by AWS Lambda proxy integrations.
    Replace placeholders like `{AWS_REGION}`, `{AWS_ACCOUNT_ID}`, and `{COGNITO_USER_POOL_ARN}` before importing.
    Lambda function names are placeholders (e.g., ChatHandler) — adjust to your deployed function names.

servers:
  - url: https://{rest_api_id}.execute-api.{AWS_REGION}.amazonaws.com/{stage}
    variables:
      rest_api_id:
        default: abcdef1234
      AWS_REGION:
        default: us-east-1
      stage:
        default: prod

x-amazon-apigateway-version: "2017-08-01"
x-amazon-apigateway-api-key-source: HEADER
x-amazon-apigateway-minimum-compression-size: 0
x-amazon-apigateway-cors:
  allowOrigins:
    - "*"
  allowHeaders:
    - Content-Type
    - X-Amz-Date
    - Authorization
    - X-Api-Key
    - X-Amz-Security-Token
  allowMethods:
    - GET
    - POST
    - DELETE
    - OPTIONS
  maxAge: 86400

# Request validators (optional but recommended)
x-amazon-apigateway-request-validators:
  body-only:
    validateRequestBody: true
    validateRequestParameters: false
  params-and-body:
    validateRequestBody: true
    validateRequestParameters: true

tags:
  - name: Chat
    description: Send user prompts and receive model responses.
  - name: Sessions
    description: Manage chat sessions.
  - name: Messages
    description: Retrieve chat messages with pagination.
  - name: Attachments
    description: Pre-signed upload URLs for user attachments.
  - name: Models
    description: Discovery of available model IDs.
  - name: Health
    description: Health and readiness checks.

paths:
  /chat:
    post:
      tags: [Chat]
      summary: Send a chat request and receive the assistant response.
      operationId: chat
      security:
        - CognitoUserPoolAuth: []
        - ApiKeyAuth: []
      x-amazon-apigateway-request-validator: body-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            examples:
              simple:
                value:
                  sessionId: "sess_123"
                  modelId: "anthropic.claude-3-5-sonnet"
                  messages:
                    - role: user
                      content: "Explain vector databases in simple terms."
                  stream: false
      responses:
        "200":
          description: Chat response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized
        "429":
          description: Rate limited
        "500":
          description: Server error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: "1.0"
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:ChatHandler/invocations

  /sessions:
    get:
      tags: [Sessions]
      summary: List chat sessions (for the authenticated user).
      operationId: listSessions
      security:
        - CognitoUserPoolAuth: []
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: nextToken
          schema: { type: string }
      responses:
        "200":
          description: Sessions page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  nextToken:
                    type: string
        "401":
          description: Unauthorized
        "500":
          description: Server error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: "1.0"
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:SessionsHandler/invocations
    post:
      tags: [Sessions]
      summary: Create a new chat session.
      operationId: createSession
      security:
        - CognitoUserPoolAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        "401":
          description: Unauthorized
        "500":
          description: Server error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: "1.0"
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:SessionsHandler/invocations

  /sessions/{sessionId}:
    delete:
      tags: [Sessions]
      summary: Delete a session by ID.
      operationId: deleteSession
      security:
        - CognitoUserPoolAuth: []
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "500":
          description: Server error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: "1.0"
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:SessionsHandler/invocations

  /messages:
    get:
      tags: [Messages]
      summary: List messages in a session.
      operationId: listMessages
      security:
        - CognitoUserPoolAuth: []
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: nextToken
          schema: { type: string }
      responses:
        "200":
          description: Messages page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  nextToken:
                    type: string
        "401":
          description: Unauthorized
        "404":
          description: Session not found
        "500":
          description: Server error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: "1.0"
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:MessagesHandler/invocations

  /attachments/presign:
    post:
      tags: [Attachments]
      summary: Get a pre-signed S3 URL for uploading an attachment.
      operationId: createPresignedUpload
      security:
        - CognitoUserPoolAuth: []
        - ApiKeyAuth: []
      x-amazon-apigateway-request-validator: body-only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType, size]
              properties:
                filename: { type: string, maxLength: 255 }
                contentType: { type: string }
                size: { type: integer, minimum: 1, maximum: 104857600 } # up to 100 MB
            examples:
              png:
                value: { filename: "diagram.png", contentType: "image/png", size: 524288 }
      responses:
        "200":
          description: Upload URL details
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl: { type: string }
                  objectKey: { type: string }
                  expiresIn: { type: integer, description: "Seconds until expiration" }
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "500":
          description: Server error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: "1.0"
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:AttachmentsHandler/invocations

  /models:
    get:
      tags: [Models]
      summary: List supported model identifiers.
      operationId: listModels
      security:
        - CognitoUserPoolAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'
        "401":
          description: Unauthorized
        "500":
          description: Server error
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: "1.0"
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:ModelsHandler/invocations

  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        payloadFormatVersion: "1.0"
        uri:
          Fn::Sub: arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:HealthHandler/invocations

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    CognitoUserPoolAuth:
      type: oauth2
      flows: {}
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
          - "{COGNITO_USER_POOL_ARN}"

  schemas:
    ChatRequest:
      type: object
      required: [messages]
      properties:
        sessionId:
          type: string
          description: Optional session to continue; if absent, server may create one.
        modelId:
          type: string
          description: Provider-specific model identifier.
          example: anthropic.claude-3-5-sonnet
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MessageInput'
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        maxTokens:
          type: integer
          minimum: 1
          maximum: 32768
    MessageInput:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, system, assistant, tool]
        content:
          type: string
          maxLength: 20000
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
    ChatResponse:
      type: object
      properties:
        sessionId: { type: string }
        message:
          $ref: '#/components/schemas/Message'
        usage:
          type: object
          properties:
            inputTokens: { type: integer }
            outputTokens: { type: integer }
            totalTokens: { type: integer }
    Message:
      type: object
      properties:
        id: { type: string }
        role:
          type: string
          enum: [user, assistant, system, tool]
        content: { type: string }
        createdAt:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
    Session:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastMessagePreview: { type: string }
    Attachment:
      type: object
      properties:
        objectKey: { type: string }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer }
    Model:
      type: object
      properties:
        id: { type: string, example: anthropic.claude-3-5-sonnet }
        provider: { type: string, example: bedrock }
        modality: { type: string, enum: [text, image, audio, multi] }
        contextWindow: { type: integer }
    ErrorResponse:
      type: object
      properties:
        message: { type: string }
        code: { type: string }
        requestId: { type: string }
